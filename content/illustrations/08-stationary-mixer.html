<div class="ctl"><button class="btn" id="sm-toggle">Stop</button><button class="btn" id="sm-rev">Reverse</button></div>
</div>
<script>
(function(){
  var RPS=0.35, RAMP=1.2;
  var wheels=[].slice.call(document.querySelectorAll('.sm-wheel'));
  var target=1,dir=1,v=0,ang=0,last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var vmax=360*RPS, goal=target*dir*vmax, step=vmax/RAMP*dt;
    v+=Math.max(-step,Math.min(step,goal-v)); ang=(ang+v*dt)%360;
    wheels.forEach(function(g){g.setAttribute('transform','rotate('+ang.toFixed(2)+' '+g.dataset.cx+' '+g.dataset.cy+')')});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('sm-toggle');
  tb.onclick=function(){target=target?0:1;tb.textContent=target?'Stop':'Start';tb.classList.toggle('on',!target)};
  var rb=document.getElementById('sm-rev');
  rb.onclick=function(){dir=-dir;rb.classList.toggle('on',dir<0)};
})();
</script>
<script>(function(){function h(){parent.postMessage({type:'machine-anim-height',id:document.body.dataset.machine,height:Math.ceil(document.querySelector('.frame').getBoundingClientRect().height)},'*')}addEventListener('load',h);addEventListener('resize',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.querySelector('.frame'))})();</script>
