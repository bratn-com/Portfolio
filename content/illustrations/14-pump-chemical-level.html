<script>
(function(){
  var EMPTY=470, FULL=244, FILL_MS=4000, HOLD_MS=1500, M0=0, M1=453.73-204.7;
  var liq=document.getElementById('pc-liq'), topL=document.getElementById('pc-top'), mark=document.getElementById('pc-mark');
  var start=performance.now(), loop=false, paused=false, pausedAt=0, t0=start, wbLast=0, wbPh=[0,0,0], wbPb=[0,0,0];
  function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
  function f(v){return v.toFixed(2)}
  function frame(now){
    if(!paused){
      var e=now-start, p=Math.min(1,e/FILL_MS);
      if(loop&&e>FILL_MS+HOLD_MS){start=now;p=0}
      var q=ease(p), y=EMPTY-(EMPTY-FULL)*q, t=(now-t0)/1000;
      var w=(p<1?2:1.2*Math.max(0,1-(e-FILL_MS)/1000))*Math.sin(t*6);
      var surf='M110 '+f(y-w)+'Q162 '+f(y+w*1.6)+' 214 '+f(y+w);
      liq.setAttribute('d',surf+'V480H110Z');
      topL.setAttribute('d',surf+'V'+f(y+w+3.5)+'Q162 '+f(y+w*1.6+3.5)+' 110 '+f(y-w+3.5)+'Z');
      mark.setAttribute('transform','translate(0 '+f(-M1*q)+')');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('pc-replay').onclick=function(){start=performance.now();if(paused)toggle()};
  document.getElementById('pc-loop').onclick=function(){loop=!loop;this.classList.toggle('on',loop);if(loop)start=performance.now()};
  var pb=document.getElementById('pc-pause');
  function toggle(){paused=!paused;if(paused){pausedAt=performance.now()}else{var d=performance.now()-pausedAt;start+=d;t0+=d;if(typeof wtLast!=='undefined')wtLast=0;if(typeof wbLast!=='undefined')wbLast=0}pb.textContent=paused?'Play':'Pause';pb.classList.toggle('on',paused)}
  pb.onclick=toggle;
})();
</script>
