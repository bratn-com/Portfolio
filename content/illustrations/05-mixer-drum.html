<script>
(function(){
  // Gray ribs and orange cone blades share one set of angles θ on the drum, so each rib and its blade read as one line.
  // Side view: y = cy + R·sinθ, thickness ∝ cosθ, ends bend toward the axis with sinθ (barrel curvature). Back side hidden.
  var NS='http://www.w3.org/2000/svg', OMEGA=0.7, RAMP=1.5, N=5, CY=201.7, R=200, C0=Math.cos(36*Math.PI/180);
  function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e}
  var ribHost=document.getElementById('mx-ribs'), finHost=document.getElementById('mx-fins');
  var lines=[];for(var i=0;i<N;i++){lines.push({a0:(-36+72*i)*Math.PI/180,rib:el('path',{fill:'#66686A'},ribHost),cap:el('path',{fill:'#48494D'},ribHost),fin:el('polygon',{fill:'#A8471D'},finHost)})}
  function f(v){return v.toFixed(1)}
  // Seam between gray shell and orange cone (from the drawing's two cubics) → x at any y,
  // so the dark cap and the blade root stay glued to the curved edge instead of a fixed x.
  function cub(p0,p1,p2,p3,t){var u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3}
  var SEAM=[];[[453.1,5.04,453.1,5.04,467.149,52.36,467.149,211.45],[467.149,211.45,467.149,370.54,453.779,424.28,453.779,424.28]].forEach(function(c){
    for(var j=0;j<=60;j++){var t=j/60;SEAM.push([cub(c[1],c[3],c[5],c[7],t),cub(c[0],c[2],c[4],c[6],t)])}
  });
  function seamX(y){for(var j=1;j<SEAM.length;j++){if(SEAM[j][0]>=y){var A=SEAM[j-1],B=SEAM[j],q=(y-A[0])/((B[0]-A[0])||1);return A[1]+(B[1]-A[1])*q}}return SEAM[SEAM.length-1][1]}
  var target=1,dir=1,w=0,ang=0,last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var goal=target*dir*OMEGA, step=OMEGA/RAMP*dt;
    w+=Math.max(-step,Math.min(step,goal-w)); ang+=w*dt;
    lines.forEach(function(l){
      var a=l.a0+ang, sn=Math.sin(a), c=Math.cos(a);
      var show=c>0.01?'':'none';
      l.rib.setAttribute('display',show);l.cap.setAttribute('display',show);l.fin.setAttribute('display',show);
      if(!show){
        var y=CY+R*sn, k=c/C0, ht=15*k, b=-37*sn;
        var sT=seamX(y-ht), sB=seamX(y+ht);
        l.rib.setAttribute('d','M'+f(sT-11)+' '+f(y-ht)+'H154C100 '+f(y-ht)+' 60 '+f(y-ht+b)+' 30 '+f(y-ht+b)+'V'+f(y+ht+b)+'C60 '+f(y+ht+b)+' 100 '+f(y+ht)+' 154 '+f(y+ht)+'H'+f(sB-11)+'Z');
        l.cap.setAttribute('d','M'+f(sT-11)+' '+f(y-ht)+'H'+f(sT+.6)+'L'+f(sB+.6)+' '+f(y+ht)+'H'+f(sB-11)+'Z');
        var y2=CY+126*sn, hf=8.5*k, s0=seamX(y-hf), s1=seamX(y+hf);
        l.fin.setAttribute('points',[s0,y-hf,624,y2-hf*.8,624,y2+hf*.8,s1,y+hf].map(f).join(' '));
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('mx-toggle');
  tb.onclick=function(){target=target?0:1;tb.textContent=target?'Stop':'Start';tb.classList.toggle('on',!target)};
  var rb=document.getElementById('mx-rev');
  rb.onclick=function(){dir=-dir;rb.classList.toggle('on',dir<0)};
})();
</script>
