<script>
(function(){
  // Each arc fires in turn (inner → outer) and drifts a little away from the bell while it fades, like a travelling wavefront.
  var PERIOD=1.1, LAG=.18, DRIFT=14, CX=641, CY=204;
  var arcs=[].slice.call(document.querySelectorAll('.hn-arc'));
  var on=1,k=1,t=0,last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    k+=Math.max(-dt/.4,Math.min(dt/.4,on-k)); t+=dt;
    arcs.forEach(function(g,i){
      var p=((t-i*LAG)/PERIOD%1+1)%1;
      var rise=Math.min(1,p/.12), fall=1-Math.max(0,(p-.12)/.5);
      var o=Math.max(0,Math.min(rise,fall));
      var d=DRIFT*(p-.12), s=1+.04*(p-.12);
      g.setAttribute('opacity',(.12+.88*o*k).toFixed(3));
      g.setAttribute('transform','translate('+(CX+d).toFixed(2)+' '+CY+') scale('+s.toFixed(4)+') translate('+(-CX)+' '+(-CY)+')');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('hn-toggle');
  tb.onclick=function(){on=on?0:1;tb.textContent=on?'Stop':'Start';tb.classList.toggle('on',!on)};
})();
</script>
