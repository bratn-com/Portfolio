<script>
(function(){
  // One 1.5 s cycle: gates swing open 0–0.35 s, sand falls 0.2–1.2 s, gates close 1.1–1.5 s.
  var DUR=1500, OPEN=26, PL=[155.63,348.29], PR=[222.75,348.29], GROUND=458, CX=189;
  var NS='http://www.w3.org/2000/svg';
  var gL=document.getElementById('agg-gate-l'), gR=document.getElementById('agg-gate-r');
  var stream=document.getElementById('agg-stream'), clip=document.getElementById('agg-sclip-r');
  var pile=document.getElementById('agg-pile'), topSand=document.getElementById('agg-top'), grainHost=document.getElementById('agg-grains');
  function sm(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
  function f(v){return v.toFixed(1)}
  var grains=[];for(var i=0;i<16;i++){var c=document.createElementNS(NS,'circle');c.setAttribute('r',(1.6+(i*7%5)*.45).toFixed(2));grainHost.appendChild(c);grains.push({c:c,t0:.18+(i*.61%1)*.85,vx:((i*37%11)-5)*7})}
  var start=null, loop=false;
  function render(ms){
    var t=ms/1000;
    var open=sm(0,.35,t)*(1-sm(1.1,1.5,t)), a=OPEN*open;
    gL.setAttribute('transform','rotate('+f(a)+' '+PL[0]+' '+PL[1]+')');
    gR.setAttribute('transform','rotate('+f(-a)+' '+PR[0]+' '+PR[1]+')');
    // stream: head drops with gravity, tail follows once the gates start closing
    var head=380+Math.min(1,Math.max(0,(t-.2)/.28))**2*(GROUND-380), tail=380+sm(1.05,1.35,t)*(GROUND-380);
    var w=6+30*open;
    stream.setAttribute('d','M'+f(CX-w*.55)+' 380C'+f(CX-w*.5)+' 420 '+f(CX-w*.8)+' 440 '+f(CX-w)+' '+GROUND+'H'+f(CX+w)+'C'+f(CX+w*.8)+' 440 '+f(CX+w*.5)+' 420 '+f(CX+w*.55)+' 380Z');
    clip.setAttribute('y',f(tail));clip.setAttribute('height',f(Math.max(0,head-tail)));
    // pile grows on the ground while sand lands
    var p=sm(.45,1.3,t), pw=10+48*p, ph=2+20*p;
    pile.setAttribute('d',t<.45?'':'M'+f(CX-pw)+' '+GROUND+'C'+f(CX-pw*.5)+' '+f(GROUND-ph*.2)+' '+f(CX-pw*.35)+' '+f(GROUND-ph)+' '+CX+' '+f(GROUND-ph)+'C'+f(CX+pw*.35)+' '+f(GROUND-ph)+' '+f(CX+pw*.5)+' '+f(GROUND-ph*.2)+' '+f(CX+pw)+' '+GROUND+'Z');
    // load in the bin drops a little
    var k=1-.18*sm(.2,1.2,t);
    topSand.setAttribute('transform','translate(0 103.75) scale(1 '+k.toFixed(3)+') translate(0 -103.75)');
    grains.forEach(function(g){
      var gt=t-g.t0, life=.42;
      if(gt<0||gt>life||g.t0>1.15){g.c.setAttribute('display','none');return}
      g.c.setAttribute('display','');
      var y=388+.5*900*gt*gt+60*gt, x=CX+g.vx*gt*(.4+open);
      g.c.setAttribute('cx',f(x));g.c.setAttribute('cy',f(Math.min(GROUND-2,y)));
    });
  }
  function frame(now){
    if(start===null){requestAnimationFrame(frame);return}
    var ms=now-start;
    if(ms>=DUR){if(loop){start=now+500;ms=0}else{render(DUR);start=null;return}}
    render(Math.max(0,ms));
    requestAnimationFrame(frame);
  }
  function play(){start=performance.now();requestAnimationFrame(frame)}
  render(0);setTimeout(play,400);
  document.getElementById('agg-play').onclick=function(){if(start===null)play();else start=performance.now()};
  var lb=document.getElementById('agg-loop');
  lb.onclick=function(){loop=!loop;lb.classList.toggle('on',loop);if(loop&&start===null)play()};
})();
</script>
