<div class="bay" data-illustrations>
  <header class="bay-bar">
    <p class="bay-kicker">Sysdyne Illustrations</p>
    <p class="bay-count"><span data-bay-count>1</span> / 15</p>
  </header>
  <div class="bay-stage">
    <button class="bay-nav" type="button" data-bay-prev aria-label="Previous machine">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="bay-sheet">
      <div class="bay-screen" data-bay-screen></div>
      <div class="bay-progress" aria-hidden="true"><span data-bay-progress></span></div>
    </div>
    <button class="bay-nav" type="button" data-bay-next aria-label="Next machine">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="bay-copy">
    <p class="bay-index" data-bay-index>01</p>
    <div class="bay-text">
      <h2 data-bay-title></h2>
      <p data-bay-note></p>
    </div>
    <button class="bay-play" type="button" data-bay-play aria-pressed="true">Pause</button>
  </div>
  <div class="bay-rail" data-bay-rail role="tablist" aria-label="Machines"></div>
  <p class="sr" data-bay-live aria-live="polite"></p>
</div>
