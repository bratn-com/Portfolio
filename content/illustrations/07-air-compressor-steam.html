<script>
(function(){
  // Puffs spawn at the relief fitting, travel along the drawn cloud's direction (left, slightly up), grow and fade.
  var NS='http://www.w3.org/2000/svg', SRC=[219,191], LIFE=2.6, RATE=9, MAXO=.16;
  var host=document.getElementById('ac-steam'), pool=[], emit=1, acc=0, last=performance.now(), seed=1;
  function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}
  function spawn(){
    var p=pool.find(function(q){return !q.on});
    if(!p){p={c:document.createElementNS(NS,'circle')};host.appendChild(p.c);pool.push(p)}
    p.on=true;p.t=0;p.dx=-(150+rnd()*70);p.dy=-(35+rnd()*55);p.r=26+rnd()*18;p.w=rnd()*6.28;p.o=MAXO*(.7+rnd()*.3);
  }
  function out(t){return 1-Math.pow(1-t,2.2)}
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    acc+=dt*RATE*emit;while(acc>=1){spawn();acc-=1}
    pool.forEach(function(p){
      if(!p.on)return;
      p.t+=dt;var k=p.t/LIFE;
      if(k>=1){p.on=false;p.c.setAttribute('opacity',0);return}
      var e=out(k), x=SRC[0]+p.dx*e+Math.sin(p.t*1.6+p.w)*4*k, y=SRC[1]+p.dy*e+Math.cos(p.t*1.3+p.w)*3*k;
      var r=3+p.r*Math.pow(k,.6), o=p.o*Math.min(1,k/.08)*(1-Math.pow(k,1.6));
      p.c.setAttribute('cx',x.toFixed(1));p.c.setAttribute('cy',y.toFixed(1));p.c.setAttribute('r',r.toFixed(1));p.c.setAttribute('opacity',o.toFixed(3));
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('ac-toggle');
  tb.onclick=function(){emit=emit?0:1;tb.textContent=emit?'Stop':'Start';tb.classList.toggle('on',!emit)};
})();
</script>
