<script>
(function(){
  var AMP=3.2, ROT=.45, RAMP=.35;
  var body=document.getElementById('vb-body'), ghost=document.getElementById('vb-ghost'), base=document.getElementById('vb-base'), sh=document.getElementById('vb-shadow');
  var arcs=[].slice.call(document.querySelectorAll('.vb-arc')), marks=[].slice.call(document.querySelectorAll('.vb-mark'));
  var on=1,k=0,t=0,last=performance.now();
  function f(v){return v.toFixed(2)}
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    k+=Math.max(-dt/RAMP,Math.min(dt/RAMP,on-k)); t+=dt;
    // Two incommensurate frequencies per axis -> irregular, mechanical buzz instead of a smooth wobble
    var dx=AMP*k*(Math.sin(t*2*Math.PI*29)*.7+Math.sin(t*2*Math.PI*17.3+1)*.3);
    var dy=AMP*.55*k*(Math.sin(t*2*Math.PI*33+2)*.7+Math.sin(t*2*Math.PI*21.7)*.3);
    var r=ROT*k*Math.sin(t*2*Math.PI*25+.5);
    body.setAttribute('transform','translate('+f(dx)+' '+f(dy)+') rotate('+f(r)+' 330 740)');
    ghost.setAttribute('transform','translate('+f(-dx*1.4)+' '+f(-dy*1.4)+') rotate('+f(-r)+' 330 740)');
    ghost.setAttribute('opacity',f(.22*k));
    base.setAttribute('transform','translate('+f(dx*.25)+' '+f(dy*.15)+')');
    sh.setAttribute('rx',f(333.5+k*4*Math.sin(t*2*Math.PI*29)));
    // Waves: inner -> outer, 0.9 s cycle
    arcs.forEach(function(a,i){
      var p=((t/.9-i*.22)%1+1)%1, o=Math.max(0,Math.sin(p*Math.PI)), sc=.9+.16*p;
      a.setAttribute('opacity',f(.15+.85*o*k+(1-k)*.85));
      a.setAttribute('transform','translate(330 175) scale('+f(1+(sc-1)*k)+') translate(-330 -175)');
    });
    // Side vibration ticks flicker, offset per row
    marks.forEach(function(m,i){
      var p=((t/.32+i*.37)%1+1)%1;
      m.setAttribute('opacity',f(k*Math.max(0,Math.sin(p*Math.PI))));
      var side=i<3?-1:1;m.setAttribute('transform','translate('+f(side*(6*p)+dx*.6)+' 0)');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('vb-toggle');
  tb.onclick=function(){on=on?0:1;tb.textContent=on?'Stop':'Start';tb.classList.toggle('on',!on)};
})();
</script>
