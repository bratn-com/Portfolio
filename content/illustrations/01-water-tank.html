<script>
(function(){
  // Water rises from fully hidden (below the tank rim at y≈156) to the level drawn in the source file.
  var EMPTY=200, FILL_MS=3800, HOLD_MS=1800;
  var water=document.getElementById('wt-water');
  var waves=[].slice.call(document.querySelectorAll('.wt-wave'));
  // per-layer sway: amplitude (px), speed (rad/s), phase — kept inside each path's horizontal slack
  var W=[{a:22,s:.9,p:0},{a:30,s:.7,p:1.7},{a:26,s:1.1,p:3.1}];
  var start=performance.now(), loop=false, paused=false, pausedAt=0, t0=performance.now(), wtLast=0, wtPh=[0,0,0], wtPb=[0,0,0];
  function ease(p){return 1-Math.pow(1-p,2.4)}
  function frame(now){
    if(!paused){
      var e=now-start, p=Math.min(1,e/FILL_MS);
      if(loop && e>FILL_MS+HOLD_MS){start=now;p=0}
      var y=EMPTY-(EMPTY+71)*ease(p);
      var dt=wtLast?Math.min(.05,(now-wtLast)/1000):0; wtLast=now;
      var stir=1+.5*(1-ease(p)); // slightly livelier while pouring, eased to calm
      water.setAttribute('transform','translate(0 '+y.toFixed(2)+')');
      waves.forEach(function(g,i){
        var w=W[i]; wtPh[i]+=dt*w.s*.8*stir; wtPb[i]+=dt*w.s*1.1;
        var x=Math.sin(wtPh[i]+w.p)*w.a, b=Math.sin(wtPb[i]+w.p)*1.2;
        g.setAttribute('transform','translate('+x.toFixed(2)+' '+b.toFixed(2)+')');
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('wt-replay').onclick=function(){start=performance.now();if(paused)toggle()};
  document.getElementById('wt-loop').onclick=function(){loop=!loop;this.classList.toggle('on',loop);if(loop)start=performance.now()};
  var pb=document.getElementById('wt-pause');
  function toggle(){
    paused=!paused;
    if(paused){pausedAt=performance.now()}else{var d=performance.now()-pausedAt;start+=d;t0+=d}
    pb.textContent=paused?'Play':'Pause';pb.classList.toggle('on',paused);
  }
  pb.onclick=toggle;
})();
</script>
