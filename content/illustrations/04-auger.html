<div class="ctl"><button class="btn" id="aug-toggle">Stop</button><button class="btn" id="aug-rev">Reverse</button></div>
</div>
<script>
(function(){
  // A turning screw seen from the side reads as its flights sliding along the shaft: one pitch per revolution.
  var PITCH=81.75, RPS=0.9, RAMP=1.0;
  var g=document.getElementById('aug-flights');
  var target=1, dir=1, v=0, x=0, last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    var vmax=PITCH*RPS, goal=target*dir*vmax, step=vmax/RAMP*dt;
    v+=Math.max(-step,Math.min(step,goal-v));
    x=((x+v*dt)%PITCH+PITCH)%PITCH;
    g.setAttribute('transform','translate('+x.toFixed(2)+' 0)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('aug-toggle');
  tb.onclick=function(){target=target?0:1;tb.textContent=target?'Stop':'Start';tb.classList.toggle('on',!target)};
  var rb=document.getElementById('aug-rev');
  rb.onclick=function(){dir=-dir;rb.classList.toggle('on',dir<0)};
})();
</script>
<script>(function(){function h(){parent.postMessage({type:'machine-anim-height',id:document.body.dataset.machine,height:Math.ceil(document.querySelector('.frame').getBoundingClientRect().height)},'*')}addEventListener('load',h);addEventListener('resize',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.querySelector('.frame'))})();</script>
