<script>
(function(){
  // 1 s: valve opens and the column drops 0–0.15 s, flows to 0.6 s, tail falls by 0.85 s; dust billows on impact.
  var DUR=1000, CX=139, TOP=1042, GROUND=1086, NS='http://www.w3.org/2000/svg';
  var stream=document.getElementById('cs-stream'), pile=document.getElementById('cs-pile'), dustHost=document.getElementById('cs-dust');
  function sm(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
  function f(v){return v.toFixed(1)}
  var dust=[];for(var i=0;i<9;i++){var c=document.createElementNS(NS,'circle');dustHost.appendChild(c);dust.push({c:c,side:i%2?1:-1,sp:.5+(i*7%9)/9,t0:.18+(i*.37%1)*.35,r:7+(i*5%7)})}
  var start=null, loop=false;
  function render(ms){
    var t=ms/1000;
    var head=TOP+(GROUND-TOP)*Math.min(1,Math.pow(Math.max(0,t)/.15,2));
    var tail=TOP+(GROUND-TOP)*Math.pow(Math.max(0,Math.min(1,(t-.6)/.25)),2);
    var w=20*sm(0,.1,t)*(1-.35*sm(.55,.75,t));
    if(head-tail<.5||w<.5) stream.setAttribute('d','');
    else stream.setAttribute('d','M'+f(CX-w)+' '+f(tail)+'Q'+CX+' '+f(tail+3)+' '+f(CX+w)+' '+f(tail)+'L'+f(CX+w*1.25)+' '+f(head)+'H'+f(CX-w*1.25)+'Z');
    var p=sm(.15,.85,t), pw=8+38*p, ph=1+13*p;
    pile.setAttribute('d',t<.15?'':'M'+f(CX-pw)+' '+GROUND+'C'+f(CX-pw*.5)+' '+f(GROUND-ph*.2)+' '+f(CX-pw*.35)+' '+f(GROUND-ph)+' '+CX+' '+f(GROUND-ph)+'C'+f(CX+pw*.35)+' '+f(GROUND-ph)+' '+f(CX+pw*.5)+' '+f(GROUND-ph*.2)+' '+f(CX+pw)+' '+GROUND+'Z');
    dust.forEach(function(d){
      var k=(t-d.t0)/.55;
      if(k<0||k>1){d.c.setAttribute('opacity',0);return}
      var e=1-Math.pow(1-k,2);
      d.c.setAttribute('cx',f(CX+d.side*(14+48*d.sp*e)));
      d.c.setAttribute('cy',f(GROUND-6-16*d.sp*e));
      d.c.setAttribute('r',f(d.r*(.4+.9*e)));
      d.c.setAttribute('opacity',(.75*(1-k)*Math.min(1,k/.15)).toFixed(3));
    });
  }
  function frame(now){
    if(start===null)return;
    var ms=now-start;
    if(ms>=DUR){if(loop){start=now+400;render(DUR)}else{render(DUR);start=null;return}}
    else render(Math.max(0,ms));
    requestAnimationFrame(frame);
  }
  function play(){var idle=start===null;start=performance.now();if(idle)requestAnimationFrame(frame)}
  render(0);setTimeout(play,400);
  document.getElementById('cs-play').onclick=play;
  var lb=document.getElementById('cs-loop');
  lb.onclick=function(){loop=!loop;lb.classList.toggle('on',loop);if(loop&&start===null)play()};
})();
</script>
