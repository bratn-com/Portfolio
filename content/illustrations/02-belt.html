<div class="ctl"><button class="btn" id="belt-toggle">Stop</button><button class="btn" id="belt-rev">Reverse</button></div>
</div>
<script>
(function(){
  // Belt surface speed v (px/s) drives both the cleats and the rollers: ω = v / r.
  var PITCH=50, R=43.5, VMAX=70, RAMP=1.2; // RAMP: seconds to reach full speed
  var cleats=document.getElementById('belt-cleats');
  var rollers=[].slice.call(document.querySelectorAll('.belt-roller'));
  var target=1, dir=1, v=0, x=0, ang=0, last=performance.now();
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    var goal=target*dir*VMAX, step=VMAX/RAMP*dt;
    v+=Math.max(-step,Math.min(step,goal-v));
    x=((x+v*dt)%PITCH+PITCH)%PITCH;
    ang=(ang+v*dt/R*180/Math.PI)%360;
    cleats.setAttribute('transform','translate('+x.toFixed(2)+' 0)');
    rollers.forEach(function(g){g.setAttribute('transform','rotate('+ang.toFixed(2)+' '+g.dataset.cx+' '+g.dataset.cy+')')});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('belt-toggle');
  tb.onclick=function(){target=target?0:1;tb.textContent=target?'Stop':'Start';tb.classList.toggle('on',!target)};
  var rb=document.getElementById('belt-rev');
  rb.onclick=function(){dir=-dir;rb.classList.toggle('on',dir<0)};
})();
</script>
<script>(function(){function h(){parent.postMessage({type:'machine-anim-height',id:document.body.dataset.machine,height:Math.ceil(document.querySelector('.frame').getBoundingClientRect().height)},'*')}addEventListener('load',h);addEventListener('resize',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.querySelector('.frame'))})();</script>
