<script>
(function(){
  // Window spans y 38→374; drawn water top ≈135. Start fully below the floor, end at 95 % (top ≈55).
  var START=245, END=-80, FILL_MS=3800, HOLD_MS=1800;
  var water=document.getElementById('wb-water');
  var waves=[].slice.call(document.querySelectorAll('.wb-wave'));
  // sway kept inside each layer's horizontal slack vs. the window (x 99→705)
  var W=[{c:13,a:16,s:.9,p:0},{c:-7,a:16,s:.7,p:1.7},{c:0,a:28,s:1.1,p:3.1}];
  var start=performance.now(), loop=false, paused=false, pausedAt=0, t0=start, wbLast=0, wbPh=[0,0,0], wbPb=[0,0,0];
  function ease(p){return 1-Math.pow(1-p,2.4)}
  function frame(now){
    if(!paused){
      var e=now-start, p=Math.min(1,e/FILL_MS);
      if(loop&&e>FILL_MS+HOLD_MS){start=now;p=0}
      var dt=wbLast?Math.min(.05,(now-wbLast)/1000):0; wbLast=now;
      var y=START+(END-START)*ease(p), stir=1+.5*(1-ease(p));
      water.setAttribute('transform','translate(0 '+y.toFixed(2)+')');
      waves.forEach(function(g,i){
        var w=W[i]; wbPh[i]+=dt*w.s*.8*stir; wbPb[i]+=dt*w.s*1.1;
        var x=w.c+Math.sin(wbPh[i]+w.p)*w.a, b=Math.sin(wbPb[i]+w.p)*1.2;
        g.setAttribute('transform','translate('+x.toFixed(2)+' '+b.toFixed(2)+')');
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('wb-replay').onclick=function(){start=performance.now();if(paused)toggle()};
  document.getElementById('wb-loop').onclick=function(){loop=!loop;this.classList.toggle('on',loop);if(loop)start=performance.now()};
  var pb=document.getElementById('wb-pause');
  function toggle(){paused=!paused;if(paused){pausedAt=performance.now()}else{var d=performance.now()-pausedAt;start+=d;t0+=d;if(typeof wtLast!=='undefined')wtLast=0;if(typeof wbLast!=='undefined')wbLast=0}pb.textContent=paused?'Play':'Pause';pb.classList.toggle('on',paused)}
  pb.onclick=toggle;
})();
</script>
