</div>
<script>
(function(){
  var EMPTY=370, FULL=34, FILL_MS=3800, HOLD_MS=1500, DEEP=25, SAG=7.6, DSAG=9.5;
  var body=document.getElementById('pe-body'), deep=document.getElementById('pe-deep'), surf=document.getElementById('pe-surf');
  var start=performance.now(), loop=false, paused=false, pausedAt=0, t0=start, wbLast=0, wbPh=[0,0,0], wbPb=[0,0,0];
  function ease(p){return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2}
  function f(v){return v.toFixed(2)}
  function top(y,w,sg){return 'M91 '+f(y)+'C120.85 '+f(y+sg+w)+' 152.15 '+f(y+sg-w)+' 182 '+f(y)+'V400H91Z'}
  function frame(now){
    if(!paused){
      var e=now-start, p=Math.min(1,e/FILL_MS);
      if(loop&&e>FILL_MS+HOLD_MS){start=now;p=0}
      var y=EMPTY-(EMPTY-FULL)*ease(p), t=(now-t0)/1000;
      var w=(p<1?2.2:.5*Math.max(0,1-(e-FILL_MS)/1200))*Math.sin(t*7);
      body.setAttribute('d',top(y,w,SAG));
      deep.setAttribute('d',top(y+DEEP,w*.4,DSAG));
      deep.setAttribute('opacity',f(Math.min(1,Math.max(0,(EMPTY-DEEP-y)/60))));
      surf.setAttribute('cy',f(y+w*.3));
      surf.setAttribute('ry',f(7.5+w*.6));
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.getElementById('pe-replay').onclick=function(){start=performance.now();if(paused)toggle()};
  document.getElementById('pe-loop').onclick=function(){loop=!loop;this.classList.toggle('on',loop);if(loop)start=performance.now()};
  var pb=document.getElementById('pe-pause');
  function toggle(){paused=!paused;if(paused){pausedAt=performance.now()}else{var d=performance.now()-pausedAt;start+=d;t0+=d;if(typeof wtLast!=='undefined')wtLast=0;if(typeof wbLast!=='undefined')wbLast=0}pb.textContent=paused?'Play':'Pause';pb.classList.toggle('on',paused)}
  pb.onclick=toggle;
})();
</script>
