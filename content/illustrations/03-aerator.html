<script>
(function(){
  var CYCLE=2.6, REACH=150, HOOD_X=264, HOOD_Y=232;
  var streams=[].slice.call(document.querySelectorAll('.aer-s'));
  var masks=[].slice.call(document.querySelectorAll('.aer-mc'));
  var bubbles=[].slice.call(document.querySelectorAll('.aer-b')).map(function(g,i){
    var c=g.firstElementChild.getBBox(), cx=c.x+c.width/2, cy=c.y+c.height/2;
    var side=cx<HOOD_X?-1:1;
    // each bubble travels from the hood rim, through its drawn position, and a bit beyond
    var sx=HOOD_X+side*Math.min(Math.abs(cx-HOOD_X),150)*.75, sy=HOOD_Y+4;
    return {g:g,cx:cx,cy:cy,dx:cx-sx,dy:cy-sy,ph:(i*0.37)%1,sp:.75+((i*7)%5)*.08};
  });
  var on=1, k=0, last=performance.now(), t=0;
  function sm(a,b,x){x=Math.max(0,Math.min(1,(x-a)/(b-a)));return x*x*(3-2*x)}
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000); last=now;
    k+=Math.max(-dt/0.8,Math.min(dt/0.8,on-k)); t+=dt*(0.3+0.7*k);
    streams.forEach(function(g,i){
      var p=((t/CYCLE)+(i%3)*0.33+(i>2?0.16:0))%1;
      masks[i].setAttribute('r',(REACH*sm(0,.6,p)).toFixed(1));
      g.setAttribute('opacity',(k*(1-sm(.62,1,p))).toFixed(3));
    });
    bubbles.forEach(function(b){
      var p=((t*b.sp/CYCLE)+b.ph)%1, e=p*1.35-0.35; // e: -0.35 at rim → 1 at drawn spot
      var x=-b.dx*(1-e)*(e<1?1:0)+(e>=1?b.dx*(e-1):0), y=-b.dy*(1-e);
      var sc=.35+.65*sm(0,.5,p), op=k*sm(0,.15,p)*(1-sm(.75,1,p));
      b.g.setAttribute('transform','translate('+(b.cx+x).toFixed(2)+' '+(b.cy+y+Math.sin(p*9+b.ph*6)*1.5).toFixed(2)+') scale('+sc.toFixed(3)+') translate('+(-b.cx)+' '+(-b.cy)+')');
      b.g.setAttribute('opacity',op.toFixed(3));
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  var tb=document.getElementById('aer-toggle');
  tb.onclick=function(){on=on?0:1;tb.textContent=on?'Stop':'Start';tb.classList.toggle('on',!on)};
})();
</script>
